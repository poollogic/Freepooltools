<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="55%" stop-color="#07111c"/>
      <stop offset="100%" stop-color="#0c1d33"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="28%" r="55%">
      <stop offset="0%" stop-color="#1669AE" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#1669AE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="drop" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#9fd6f7"/>
      <stop offset="55%" stop-color="#4a93d1"/>
      <stop offset="100%" stop-color="#1669AE"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- water drop mark -->
  <g transform="translate(96 150)">
    <rect x="0" y="0" width="150" height="150" rx="34" fill="#1669AE" fill-opacity="0.16" stroke="#4a93d1" stroke-opacity="0.4" stroke-width="2"/>
    <g transform="translate(33 28) scale(3.6)">
      <path d="M12 2.5C12 2.5 4.5 11 4.5 16a7.5 7.5 0 0 0 15 0C19.5 11 12 2.5 12 2.5Z" fill="url(#drop)" stroke="#9fd6f7" stroke-width="0.9"/>
      <ellipse cx="9.4" cy="13" rx="1.5" ry="2.3" fill="#ffffff" opacity="0.45"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="280" y="225" font-family="Inter, Arial, sans-serif" font-weight="800" font-size="86" fill="#ffffff">Free<tspan fill="#4a93d1">Pool</tspan>Tools</text>

  <!-- tagline -->
  <text x="98" y="400" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="52" fill="#ffffff">Free pool calculators</text>
  <text x="98" y="462" font-family="Inter, Arial, sans-serif" font-weight="400" font-size="34" fill="#9fb3c9">for homeowners &amp; pool pros — no sign-up</text>

  <!-- tool chips -->
  <g font-family="Inter, Arial, sans-serif" font-weight="600" font-size="26" fill="#cfe0f0">
    <g transform="translate(98 520)">
      <rect width="190" height="58" rx="29" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="95" y="38" text-anchor="middle">Pool Volume</text>
    </g>
    <g transform="translate(304 520)">
      <rect width="160" height="58" rx="29" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="80" y="38" text-anchor="middle">Chlorine</text>
    </g>
    <g transform="translate(480 520)">
      <rect width="190" height="58" rx="29" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="95" y="38" text-anchor="middle">Stabilizer</text>
    </g>
    <g transform="translate(686 520)">
      <rect width="120" height="58" rx="29" fill="#ff720f" fill-opacity="0.16" stroke="#ff720f" stroke-opacity="0.4"/>
      <text x="60" y="38" text-anchor="middle" fill="#ffb27a">Salt</text>
    </g>
  </g>
</svg>
